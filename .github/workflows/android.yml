name: Android verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify quantum simulation
        run: bash ./test-core.sh
      - name: Build test APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Check launch activity in APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "launchable-activity: name='com.vivekmlresearch.quantumapps.app.MainActivity'"
          find app/build -path '*/com/vivekmlresearch/quantumapps/app/MainActivity.class' -print -quit | grep -q .
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: quantum-apps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
